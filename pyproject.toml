[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "swarmstrike"
version = "0.1.0"
description = "Multi-agent offensive security assessment orchestrator for authorized penetration tests"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }

dependencies = [
    # Agent harness. Separate product from the Messages API SDK:
    # https://code.claude.com/docs/en/agent-sdk
    "claude-agent-sdk>=0.1.0",
    "typer>=0.12",
    "rich>=13.7",
    "textual>=0.80",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "docker>=7.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
swarmstrike = "swarmstrike.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["swarmstrike"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
# S603/S607: we shell out to assessment tooling by design, but only ever
# through ToolExecutor, which validates argv against the engagement scope.
ignore = ["S603", "S607"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
