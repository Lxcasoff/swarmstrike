# ===========================================================================
#  swarmstrike engagement contract
# ===========================================================================
#  This file is the authority for everything the agent swarm is allowed to do.
#  It is not documentation: ScopeGuard parses it and refuses, at execution
#  time, any command that falls outside it.
#
#  Sign it before running a campaign:
#      swarmstrike engagement sign engagement.yaml
#
#  Autonomous mode refuses to start on an unsigned or modified contract.
# ===========================================================================
schema_version: 1

engagement:
  id: "ENG-2026-014"
  client: "Example Organisation"
  mission: "External security assessment"
  reference: "QUOTE-2026-014"

  # Written authorization for this test. Reproduced in the report cover page
  # and in the audit log header. Without it, do not run this tool.
  authorized_by:
    name: "Jane Doe"
    role: "CISO"
    email: "ciso@example.org"
    authorization_ref: "Signed engagement letter 2026-014 rev B"
    signed_on: "2026-10-01"

window:
  # Every tool invocation outside this window is refused.
  start: "2026-10-20T08:00:00+02:00"
  end: "2026-10-31T18:00:00+02:00"
  timezone: "Europe/Paris"
  # Optional daily gate, local to `timezone`. Omit for 24/7.
  daily_allowed_hours: "08:00-20:00"

# ---------------------------------------------------------------------------
#  Authorized targets. Anything not matched here is out of scope.
# ---------------------------------------------------------------------------
scope:
  domains:
    - name: "example.org"
      include_subdomains: true
  ips:
    - "203.0.113.10"
  cidrs:
    - "203.0.113.0/28"
  urls:
    - "https://www.example.org/"

  # When true, a domain in scope is only reachable if the IP it resolves to is
  # also in scope. Protects against a CDN or shared host that the client does
  # not own. Leave false when the client's DNS points outside their own ranges.
  require_resolved_ip_in_scope: false

# ---------------------------------------------------------------------------
#  Exclusions are evaluated FIRST and always win over `scope`.
# ---------------------------------------------------------------------------
exclusions:
  domains:
    - name: "webmail.example.org"
      include_subdomains: false
  ips:
    - "203.0.113.1"          # client's edge router, explicitly carved out
  cidrs: []
  # Refused as substrings of any requested URL path.
  url_paths:
    - "/payment/"
    - "/admin/backup"

# ---------------------------------------------------------------------------
#  Rules of engagement. These are enforced, not advisory.
# ---------------------------------------------------------------------------
rules_of_engagement:
  intensity: "normal"              # quiet | normal | aggressive
  max_requests_per_second: 10
  max_concurrent_tools: 4

  # Categorical refusals. An agent that proposes one of these gets a refusal
  # recorded in the audit log and the finding is downgraded to "theoretical".
  forbid_destructive: true
  forbid_denial_of_service: true
  forbid_data_modification: true
  forbid_persistence: true
  forbid_social_engineering: true
  forbid_pivot_outside_scope: true

  # Authentication testing against named test accounts only. Never against
  # real user accounts, and never as an unbounded password guessing run.
  credential_testing:
    allowed: false
    accounts: []                   # e.g. [{username: "pentest1", note: "..."}]

  exploitation:
    # Agents may confirm a vulnerability, then must stop. No post-exploitation
    # beyond what is needed to evidence the finding.
    allowed: true
    stop_at_proof: true

  # -------------------------------------------------------------------------
  #  Red team phases. All off unless this is genuinely a red team engagement.
  #
  #  `enabled` is the master switch and every phase also needs its own flag,
  #  so turning red team mode on does not silently turn everything on. Clients
  #  authorize these separately: a scope letter covering privilege escalation
  #  very often does not cover persistence.
  # -------------------------------------------------------------------------
  red_team:
    enabled: false

    post_exploitation: false        # enumeration from an established foothold
    privilege_escalation: false
    lateral_movement: false
    persistence: false             # also needs forbid_persistence set to false
    evasion: false                 # exercising the client's detection capability

    # Proving an exfiltration path with planted canary data. Never the client's
    # real records: moving those to prove the path creates the breach the test
    # exists to prevent.
    exfiltration_simulation: false
    canary_only: true

    # Anything established during the engagement must be removed, and the
    # report has to account for it.
    cleanup_required: true

    # Detection testing is only worth doing if someone is watching and the
    # findings can be correlated with their alerts afterwards.
    notify_defenders: false
    deconfliction_contact: ""

  # -------------------------------------------------------------------------
  #  Commands the recipe set does not cover. Three tiers, in decreasing order
  #  of what can be guaranteed:
  #
  #    structured_commands  a binary plus an argument vector. No shell, so the
  #                         scope guard reads the targets exactly as it does
  #                         for a recipe. Nothing is given up; on by default.
  #    pipelines            several structured commands piped between
  #                         containers. Later stages are limited to filters
  #                         that cannot execute, so there is still no shell.
  #    shell / scripts      cannot be checked statically — `;`, `|` and
  #                         `$(...)` mean one approved-looking string can do
  #                         anything. The guarantee becomes contained,
  #                         approved and logged rather than enforced.
  #
  #  A human approves every use of the third tier and that is not configurable:
  #  an approval an operator can switch off is not a control, and an unattended
  #  campaign that approved its own shell commands would only look governed.
  #  With the gate unattended the agents are told to use a structured command
  #  instead, so a campaign keeps running without the shell.
  # -------------------------------------------------------------------------
  arbitrary_execution:
    structured_commands: true
    pipelines: false
    shell: false
    scripts: false

    # Binaries agents may invoke beyond those the recipes already name.
    extra_binaries: []

    # How long an operator has to decide before the action is refused.
    approval_timeout_s: 300

# ---------------------------------------------------------------------------
#  Hard ceilings. The orchestrator aborts the campaign when one is reached.
# ---------------------------------------------------------------------------
budget:
  max_usd: 25.00
  max_tokens: 20000000
  max_wall_clock_minutes: 180

# ---------------------------------------------------------------------------
#  Escalation. On any `halt_on` condition the swarm stops and surfaces it.
# ---------------------------------------------------------------------------
contacts:
  emergency_stop:
    name: "Jane Doe"
    phone: "+33 1 23 45 67 89"
  halt_on:
    - "service outage or degradation observed on a target"
    - "asset discovered in scope that appears to belong to a third party"
    - "exposure of personal data or credentials"

# ---------------------------------------------------------------------------
#  Integrity. Written by `swarmstrike engagement sign`. Do not edit by hand.
# ---------------------------------------------------------------------------
integrity:
  fingerprint: null
  signature: null
  signed_at: null
