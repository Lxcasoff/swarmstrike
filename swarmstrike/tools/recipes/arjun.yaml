# Ported from the CyberStrikeAI tool recipes (Apache-2.0); see NOTICE.
# Risk tier and contract gating are swarmstrike additions.
name: arjun
binary: arjun
summary: Discover hidden HTTP parameters
domains:
- web
- api
risk: active
timeout_s: 1200
defaults:
- --stable
parameters:
- name: url
  type: string
  description: Target URL
  required: true
  format: flag_value
  flag: -u
- name: method
  type: enum
  description: Request method
  format: flag_value
  flag: -m
  choices:
  - GET
  - POST
  - JSON
- name: rate
  type: integer
  description: Requests per second
  format: flag_value
  flag: --rate-limit
  minimum: 1
  maximum: 100
guidance: Undocumented parameters are a frequent source of authorization and injection findings, because
  they were never reviewed.
