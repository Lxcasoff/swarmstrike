# Ported from the CyberStrikeAI tool recipes (Apache-2.0); see NOTICE.
# Risk tier and contract gating are swarmstrike additions.
name: impacket-secretsdump
binary: secretsdump.py
summary: Read password hashes a credential is already authorized to read
domains:
- ad
risk: privilege_escalation
timeout_s: 1800
parameters:
- name: target
  type: string
  description: domain/user:password@host, inside the authorized scope
  required: true
  format: positional
  position: 1
- name: just_dc_user
  type: string
  description: Restrict to a single account
  format: flag_value
  flag: -just-dc-user
guidance: 'Highly sensitive. Restrict it to the narrowest target that evidences the finding — usually
  one account — and never dump a whole domain to make a point. Hashes are credentials: they go in the
  engagement record, not the report body.'
