# Ported from the CyberStrikeAI tool recipes (Apache-2.0); see NOTICE.
# Risk tier and contract gating are swarmstrike additions.
name: gobuster
binary: gobuster
summary: Directory, DNS and vhost brute forcing
domains:
- web
- recon
risk: active
timeout_s: 1800
defaults:
- -q
parameters:
- name: mode
  type: enum
  description: What to enumerate
  required: true
  format: positional
  position: 1
  choices:
  - dir
  - dns
  - vhost
- name: url
  type: string
  description: Target URL or domain
  required: true
  format: flag_value
  flag: -u
- name: wordlist
  type: string
  description: Wordlist path
  format: flag_value
  flag: -w
